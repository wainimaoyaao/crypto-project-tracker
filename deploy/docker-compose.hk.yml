name: signal-reader

services:
  reader:
    build:
      context: ..
      dockerfile: Dockerfile
    image: signal-reader:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      SIGNAL_BIND: 0.0.0.0
      SIGNAL_PUBLIC_ORIGIN: https://${SIGNAL_DOMAIN:?Set SIGNAL_DOMAIN}
      OPENNEWS_TOKEN: ${OPENNEWS_TOKEN:-}
    volumes:
      - reader-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    expose:
      - '4317'
    networks:
      proxy:
        aliases:
          - signal-reader
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  reader-data:

networks:
  proxy:
    external: true
    name: web-proxy
